name: Update Historical Stock Prices, Dividends & Technical Signals

on:
  schedule:
    # Runs daily at 22:15 UTC (06:15 HKT next morning, after US, London & HK market closes)
    - cron: '15 22 * * *'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Optional comma-separated tickers override (e.g. 2800.HK,0002.HK,3433.HK,VOO)'
        required: false
        default: ''
      range:
        description: 'Yahoo Finance chart history range (e.g. 5y, 10y, max)'
        required: false
        default: '5y'

permissions:
  contents: write

concurrency:
  # Shared concurrency group with update-company-news so git commits never collide
  group: myportfolio-data-sync
  cancel-in-progress: false

jobs:
  fetch-and-commit-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install anti-429 TLS impersonation & Excel discovery dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi yfinance openpyxl

      - name: Fetch historical prices, 2018+ dividends, FX rates & daily technicals
        env:
          INPUT_TICKERS: ${{ github.event.inputs.tickers }}
          INPUT_RANGE: ${{ github.event.inputs.range }}
        run: |
          RANGE_ARG="${INPUT_RANGE:-5y}"
          if [ -n "$INPUT_TICKERS" ]; then
            python3 update_historical_prices.py --output ./historical_prices.json --range "$RANGE_ARG" --delay 1.4 --jitter 0.7 --max-retries 5 --tickers "$INPUT_TICKERS"
          else
            python3 update_historical_prices.py --output ./historical_prices.json --range "$RANGE_ARG" --delay 1.4 --jitter 0.7 --max-retries 5
          fi

      - name: Commit and push updated historical_prices.json (with pull-rebase guard)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_prices.json
          if git diff --staged --quiet; then
            echo "No changes in historical_prices.json to commit."
          else
            git commit -m "chore(data): update historical prices, 2018+ dividends, FX & technicals ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            for attempt in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep 3
            done
          fi
