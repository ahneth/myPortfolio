name: Export Monthly Historical Prices CSV (Every Monday)

on:
  schedule:
    # Runs every Monday at 01:00 UTC (09:00 HKT Monday morning)
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      frequency:
        description: 'Data frequency: M (Monthly aggregated from Daily) or D (Daily)'
        required: false
        default: 'M'
      window_days:
        description: 'Peak/Trough detection window in days (default: 100)'
        required: false
        default: '100'
      start_year:
        description: 'Start year for historical extraction (default: 2000)'
        required: false
        default: '2000'
      tickers:
        description: 'Optional comma-separated tickers override (leave blank for all myPortfolio stocks)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Shared concurrency group with other myPortfolio workflows so git commits never collide
  group: myportfolio-data-sync
  cancel-in-progress: false

jobs:
  export-monthly-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (pandas, requests, curl_cffi, yfinance, openpyxl)
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests curl_cffi yfinance openpyxl

      - name: Run stock_hist_prices.py to generate monthly_historical_prices.csv (2000 to Current Year)
        env:
          INPUT_FREQ: ${{ github.event.inputs.frequency }}
          INPUT_WINDOW: ${{ github.event.inputs.window_days }}
          INPUT_START_YEAR: ${{ github.event.inputs.start_year }}
          INPUT_TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          FREQ_ARG="${INPUT_FREQ:-M}"
          WIN_ARG="${INPUT_WINDOW:-100}"
          START_ARG="${INPUT_START_YEAR:-2000}"
          if [ -n "$INPUT_TICKERS" ]; then
            python3 stock_hist_prices.py --frequency "$FREQ_ARG" --window-days "$WIN_ARG" --start-year "$START_ARG" --output ./monthly_historical_prices.csv --delay 1.2 --tickers "$INPUT_TICKERS"
          else
            python3 stock_hist_prices.py --frequency "$FREQ_ARG" --window-days "$WIN_ARG" --start-year "$START_ARG" --output ./monthly_historical_prices.csv --delay 1.2
          fi

      - name: Commit and push monthly_historical_prices.csv to GitHub repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly_historical_prices.csv
          if git diff --staged --quiet; then
            echo "No changes in monthly_historical_prices.csv to commit."
          else
            git commit -m "chore(csv): update monthly_historical_prices.csv ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            for attempt in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep 3
            done
          fi
