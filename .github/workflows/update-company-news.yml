name: Update Company News & Catalysts

on:
  schedule:
    # Runs every 6 hours at :25 past the hour (00:25, 06:25, 12:25, 18:25 UTC)
    - cron: '25 */6 * * *'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Optional comma-separated tickers override (e.g. 2800.HK,0700.HK,VOO,AAPL)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Shared concurrency group with update-historical-prices so git commits never collide
  group: myportfolio-data-sync
  cancel-in-progress: false

jobs:
  fetch-and-commit-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install anti-429 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Fetch company news, tag catalysts & score sentiment
        env:
          INPUT_TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          if [ -n "$INPUT_TICKERS" ]; then
            python3 update_company_news.py --output ./company_news.json --delay 0.8 --tickers "$INPUT_TICKERS"
          else
            python3 update_company_news.py --output ./company_news.json --delay 0.8
          fi

      - name: Commit and push updated company_news.json (with pull-rebase guard)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company_news.json
          if git diff --staged --quiet; then
            echo "No changes in company_news.json to commit."
          else
            git commit -m "chore(data): update company news & catalysts ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            for attempt in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep 3
            done
          fi
