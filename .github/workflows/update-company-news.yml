name: Update Company & Watchlist News (v3.0.1)

on:
  schedule:
    # Runs every 6 hours at minute 25 (00:25, 06:25, 12:25, 18:25 UTC)
    - cron: '25 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: myportfolio-data-sync
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install curl_cffi for TLS Impersonation
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Run update_company_news.py (v3.0.1)
        run: |
          python3 update_company_news.py --output ./company_news.json --prices ./historical_prices.json --delay 0.8

      - name: Commit and push updated company_news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company_news.json
          if git diff --staged --quiet; then
            echo "No changes to company_news.json"
            exit 0
          fi
          git commit -m "chore(news): update company & watchlist news snapshot [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break
            sleep 3
          done
